name: pages

# Deploy the static site (site/**) to GitHub Pages.
#
# Replaces Netlify Git auto-deploy. Publishes ONLY the site/ directory as the
# Pages artifact, so the repository root (.claude/, scripts/, CLAUDE.md, .env)
# is never uploaded or served.
#
# One-time repo setup required: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Without that, the deploy step has nothing to publish to.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
